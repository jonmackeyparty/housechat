<!DOCTYPE html>
<html>
<head>
    <title>Login — Mein Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body class="login-page">
    <div class="app">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo"><img src="{{ url_for('static', filename='branding/mein_chat_logo.svg') }}" alt="Mein Chat" class="app-logo"></div>
                <div class="app-name">Mein Chat</div>
            </div>
        </div>
        <div class="main">
            <div class="main-content" style="align-items:center; justify-content:center; display:flex;">
                <div class="login-card">
                    <div class="login-brand">
                        <div class="login-logo"><img src="{{ url_for('static', filename='branding/mein_chat_logo.svg') }}" alt="Mein Chat" class="login-avatar"></div>
                        <div class="login-title">Mein Chat</div>
                    </div>
                    <p class="login-sub">Pick a display name to join the chat.</p>
                    <form method="post" class="login-form">
                        <input type="text" name="username" placeholder="Your name" required class="login-input">
                        <button type="submit" class="login-btn">Join</button>
                    </form>
                    <div style="margin-top:10px; font-size:12px; color:#6b7785; text-align:center;">No account required — your name will be visible to others.</div>
                </div>
            </div>
        </div>
    </div>
    <script>/* small tweak: focus input when page loads */(function(){try{document.querySelector('.login-input').focus();}catch(e){}})()</script>
</body>
</html>
