<!DOCTYPE html>
<html>
<head>
    <title>Welcome to Mein Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="app">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo"><img src="{{ url_for('static', filename='branding/mein_chat_logo.svg') }}" alt="Mein Chat" class="app-logo"></div>
                <div class="app-name">Mein Chat</div>
            </div>
        </div>
        <div class="main">
            <div class="main-content" style="display:flex; align-items:center; justify-content:center;">
                {% if not username %}
                    <div class="login-card">
                        <div class="login-brand">
                            <div class="login-logo"><img src="{{ url_for('static', filename='branding/mein_chat_logo.svg') }}" alt="Mein Chat" class="login-avatar"></div>
                            <div class="login-title">Mein Chat</div>
                        </div>
                        <p class="login-sub">Pick a display name to join the chat.</p>
                        <form method="post" action="{{ url_for('login') }}" class="login-form">
                            <input type="text" name="username" placeholder="Your name" required class="login-input">
                            <button type="submit" class="login-btn">Join</button>
                        </form>
                        <div style="margin-top:10px; font-size:12px; color:#6b7785; text-align:center;">No account required — your name will be visible to others.</div>
                    </div>
                {% else %}
                    <div style="max-width:560px; width:100%;">
                        <h2 style="margin-top:0;">Welcome to Mein Chat, {{ username }}!</h2>
                        <p>
                            <a href="{{ url_for('channel_view', channel=first_channel) }}">Go to Channels</a>
                        </p>
                        <p>
                            Or create a new channel:
                            <form method="post" action="{{ url_for('create_channel') }}">
                                <input type="text" name="name" placeholder="Channel name" required>
                                <button type="submit">Create</button>
                            </form>
                        </p>
                        <p>
                            <a href="{{ url_for('logout') }}">Logout</a>
                        </p>
                    </div>
                {% endif %}
            </div>
        </div>
    </div>
</body>
