<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Mein Chat logo">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#5865f2"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- white rounded background; colored shapes are placed to reach the interior edges -->
  <rect width="120" height="120" rx="18" fill="#ffffff"/>
  <!-- four rounded pill shapes arranged as a loose hash, inspired-by-but-distinct-from common chat marks -->
  <g transform="translate(60,60)">
    <!-- Blade path (points right) centered at origin; rotated to create pinwheel -->
    <!-- path shape: narrow inner end at center -> wide curved outer tip -> back to center -->
    <path d="M0 0 L36 -18 C46 -10 46 10 36 18 L0 0 Z" fill="url(#g1)" transform="rotate(0)"/>
    <path d="M0 0 L36 -18 C46 -10 46 10 36 18 L0 0 Z" fill="url(#g2)" transform="rotate(90)"/>
    <path d="M0 0 L36 -18 C46 -10 46 10 36 18 L0 0 Z" fill="#f59e0b" transform="rotate(180)"/>
    <path d="M0 0 L36 -18 C46 -10 46 10 36 18 L0 0 Z" fill="#ec4899" transform="rotate(270)"/>
  </g>
  <!-- mark: no initials (MC removed) -->
</svg>
